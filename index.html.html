<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dino the Rino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one framed game window on an off-white page. Scores above, big touch buttons below. Single committed look: blue on off-white, inverting to off-white on blue at "night". */
:root {
  --paper: #F1F2EE;
  --paper-2: #E3E7F2;
  --blue: #2F5BEA;
  --blue-deep: #14246B;
  --blue-soft: #AFC4FB;
  --muted: #4A5A9E;
  --font-display: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
html { background: var(--paper); }
body {
  background: var(--paper);
  color: var(--blue-deep);
  font: 14px/1.5 var(--font-body);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 820px; margin-inline: auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.brand { min-width: 0; }
h1 {
  margin: 0;
  font: 700 clamp(28px, 7vw, 48px)/1 var(--font-display);
  color: var(--blue);
  letter-spacing: .01em;
  text-wrap: balance;
}
.tag { margin: 8px 0 0; color: var(--muted); }
.hud { display: flex; gap: 22px; }
.stat { display: grid; gap: 4px; }
.lab { font: 400 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.val { font: 700 clamp(20px, 5vw, 26px)/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--blue-deep); }
.val.flash { animation: blink .5s steps(1) 2; }
@keyframes blink { 50% { opacity: .15; } }

.stage {
  position: relative;
  border: 3px solid var(--blue-deep);
  background: var(--paper);
  box-shadow: 6px 6px 0 var(--blue);
  touch-action: manipulation;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; pointer-events: none; }
.plate {
  background: var(--paper);
  border: 3px solid var(--blue-deep);
  box-shadow: 4px 4px 0 var(--blue-deep);
  padding: 12px 18px;
  text-align: center;
  max-width: 100%;
}
.ov-title { margin: 0 0 6px; font: 700 clamp(16px, 4vw, 22px)/1.2 var(--font-display); color: var(--blue); }
.ov-text { margin: 0; font-size: 13px; }

.controls { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 12px; }
.btn {
  font: 700 14px/1 var(--font-display);
  letter-spacing: .06em;
  text-transform: uppercase;
  min-height: 54px;
  padding: 12px;
  border: 3px solid var(--blue-deep);
  background: var(--paper);
  color: var(--blue-deep);
  box-shadow: 3px 3px 0 var(--blue-deep);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn.primary { background: var(--blue); color: var(--paper); }
.btn.small { font-size: 12px; }
.btn:active, .btn.down { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--blue-deep); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
@media (max-width: 560px) { .controls { grid-template-columns: 1fr 1fr; } }
.hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 2; }
kbd { font: 500 12px var(--font-body); border: 2px solid var(--blue-deep); background: var(--paper-2); color: var(--blue-deep); padding: 0 5px; }
@media (prefers-reduced-motion: reduce) {
  .val.flash { animation: none; }
  .btn:active, .btn.down { transform: none; }
}
</style>

<main class="wrap">
  <header>
    <div class="brand">
      <h1>Dino the Rino</h1>
      <p class="tag">Jump the cacti. Duck the birds. Keep running.</p>
    </div>
    <div class="hud">
      <div class="stat"><span class="lab">Hi</span><span class="val" id="hi">00000</span></div>
      <div class="stat"><span class="lab">Score</span><span class="val" id="score">00000</span></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="640" height="240" role="img" aria-label="Dino the Rino game: a blue rhino runs along the ground, jumping over cacti and ducking under birds."></canvas>
    <div class="overlay" id="overlay" role="status" aria-live="polite">
      <div class="plate">
        <p class="ov-title" id="ovTitle">Ready?</p>
        <p class="ov-text" id="ovText">Press Space or tap to run</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="btn primary" id="btnJump">Jump</button>
    <button type="button" class="btn" id="btnDuck">Duck</button>
    <button type="button" class="btn small" id="btnPause">Pause</button>
    <button type="button" class="btn small" id="btnSound" aria-pressed="true">Sound on</button>
  </div>

  <p class="hint"><kbd>Space</kbd> or <kbd>&uarr;</kbd> jump (hold for a higher jump) &middot; <kbd>&darr;</kbd> duck, or drop faster in the air &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> sound</p>
</main>

<script>
(function () {
  'use strict';

  var W = 640, H = 240, GROUND = 200, RX = 56, STEP = 1000 / 60;
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('game'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var scoreEl = $('score'), hiEl = $('hi'), overlay = $('overlay');
  var ovTitle = $('ovTitle'), ovText = $('ovText'), stage = $('stage');
  var btnJump = $('btnJump'), btnDuck = $('btnDuck'), btnPause = $('btnPause'), btnSound = $('btnSound');

  /* ---------- storage (optional) ---------- */
  function readStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function writeStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var hi = parseInt(readStore('dino-the-rino-hi'), 10) || 0;
  var muted = readStore('dino-the-rino-mute') === '1';
  function pad(n) { return String(Math.floor(n)).padStart(5, '0'); }

  /* ---------- palette: day (blue on off-white) and night (off-white on blue) ---------- */
  var DAY = { bg: '#F1F2EE', ink: '#14246B', body: '#2F5BEA', belly: '#AFC4FB', horn: '#14246B', eye: '#F1F2EE', cloud: '#DCE3F6', dots: '#A9B9EC', star: '#F1F2EE' };
  var NIGHT = { bg: '#1F3FC0', ink: '#F1F2EE', body: '#F1F2EE', belly: '#AFC4FB', horn: '#0F1B52', eye: '#1F3FC0', cloud: '#3659D6', dots: '#6B87EA', star: '#F1F2EE' };
  var KEYS = Object.keys(DAY);
  function rgb(c) { return [1, 3, 5].map(function (i) { return parseInt(c.slice(i, i + 2), 16); }); }
  var A = {}, B = {}, pal = {};
  KEYS.forEach(function (k) { A[k] = rgb(DAY[k]); B[k] = rgb(NIGHT[k]); });
  function mixPal(t) {
    KEYS.forEach(function (k) {
      pal[k] = 'rgb(' + A[k].map(function (v, i) { return Math.round(v + (B[k][i] - v) * t); }).join(',') + ')';
    });
  }

  /* ---------- sound ---------- */
  var ac = null;
  function audio() {
    if (ac === null) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = false; }
    }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }
    return ac;
  }
  function beep(f1, f2, dur, type, vol) {
    if (muted) return;
    var a = audio();
    if (!a) return;
    try {
      var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t);
      o.frequency.linearRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  /* ---------- game state ---------- */
  var state = 'ready'; // ready | running | paused | over
  var speed, score, lift, vy, animTick, obstacles, distSince, nextGap, lastMilestone, dead, diedAt = 0;
  var duck = false, nightT = 0, nightTarget = 0, acc = 0, last = 0;

  var clouds = [
    { x: 70, y: 34, s: 1 }, { x: 290, y: 70, s: 0.7 }, { x: 500, y: 28, s: 0.9 }, { x: 610, y: 82, s: 0.6 }
  ];
  var dots = [], stars = [], i;
  for (i = 0; i < 46; i++) dots.push({ x: Math.random() * W, y: GROUND + 8 + Math.random() * 28, w: 2 + Math.floor(Math.random() * 3) * 3 });
  for (i = 0; i < 16; i++) stars.push({ x: Math.random() * W, y: 8 + Math.random() * 110, p: Math.random() * 6 });

  function reset() {
    speed = 6; score = 0; lift = 0; vy = 0; animTick = 0;
    obstacles = []; distSince = 0; nextGap = 320; lastMilestone = 0; dead = false;
    scoreEl.textContent = pad(0);
  }
  reset();
  hiEl.textContent = pad(hi);

  function showOverlay(title, text) { ovTitle.textContent = title; ovText.textContent = text; overlay.hidden = false; }

  function start() { reset(); state = 'running'; overlay.hidden = true; acc = 0; btnPause.textContent = 'Pause'; }
  function resume() { state = 'running'; overlay.hidden = true; acc = 0; btnPause.textContent = 'Pause'; }
  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      showOverlay('Paused', 'Press P or Space to continue');
      btnPause.textContent = 'Resume';
    } else if (state === 'paused') { resume(); }
  }

  function jump() {
    if (lift === 0 && vy === 0 && !dead) { vy = 11.5; lift = 0.01; beep(380, 760, 0.14, 'square', 0.05); }
  }
  function releaseJump() { if (vy > 6) vy = 6; }

  function press() {
    if (!muted) audio();
    if (state === 'ready') { start(); jump(); }
    else if (state === 'over') { if (performance.now() - diedAt > 350) start(); }
    else if (state === 'paused') { resume(); }
    else { jump(); }
  }

  function die() {
    state = 'over'; dead = true; diedAt = performance.now();
    beep(320, 60, 0.4, 'sawtooth', 0.07);
    var s = Math.floor(score), best = false;
    if (s > hi) { hi = s; best = true; writeStore('dino-the-rino-hi', String(hi)); hiEl.textContent = pad(hi); }
    scoreEl.textContent = pad(s);
    showOverlay('Game over', 'Score ' + pad(s) + (best ? ' · New best!' : '') + ' · Press Space or tap to run again');
  }

  /* ---------- obstacles ---------- */
  function spawn() {
    var o;
    if (score > 250 && Math.random() < 0.3) {
      var high = Math.random() < 0.5;
      o = { kind: 'bird', x: W + 20, y: GROUND - (high ? 56 : 34), w: 44, h: 24, t: 0 };
    } else {
      var n = score > 500 ? 1 + Math.floor(Math.random() * 3) : (score > 150 ? 1 + Math.floor(Math.random() * 2) : 1);
      var parts = [], dx = 0;
      for (var k = 0; k < n; k++) {
        var tall = n === 3 ? k === 1 : Math.random() < 0.45;
        var w = tall ? 26 : 20, h = tall ? 56 : 38;
        parts.push({ dx: dx, w: w, h: h });
        dx += w + 4;
      }
      o = { kind: 'cactus', x: W + 20, parts: parts, w: dx - 4 };
    }
    obstacles.push(o);
    distSince = 0;
    nextGap = speed * (42 + Math.random() * 28) + o.w * 0.5 + 20;
  }

  function hitboxes(o) {
    if (o.kind === 'bird') return [{ x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 8 }];
    return o.parts.map(function (p) { return { x: o.x + p.dx + 4, y: GROUND - p.h + 3, w: p.w - 8, h: p.h - 3 }; });
  }
  function rhinoBox() {
    var ducking = duck && lift === 0;
    var hh = ducking ? 30 : 52, top = GROUND - lift - hh;
    return ducking ? { x: RX + 8, y: top + 4, w: 50, h: hh - 8 } : { x: RX + 8, y: top + 8, w: 46, h: hh - 12 };
  }
  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  /* ---------- update ---------- */
  function moveSky(rate) {
    clouds.forEach(function (c) {
      c.x -= rate * c.s;
      if (c.x < -60) { c.x = W + Math.random() * 80; c.y = 20 + Math.random() * 70; }
    });
    nightT += (nightTarget - nightT) * 0.02;
    if (Math.abs(nightTarget - nightT) < 0.002) nightT = nightTarget;
  }

  function update() {
    speed = Math.min(13, speed + 0.0016);
    score += speed * 0.045;
    var sc = Math.floor(score);
    scoreEl.textContent = pad(sc);
    if (sc >= lastMilestone + 100) {
      lastMilestone = Math.floor(sc / 100) * 100;
      scoreEl.classList.add('flash');
      setTimeout(function () { scoreEl.classList.remove('flash'); }, 1100);
      beep(880, 880, 0.08, 'square', 0.04);
      setTimeout(function () { beep(1180, 1180, 0.1, 'square', 0.04); }, 90);
    }
    nightTarget = Math.floor(score / 600) % 2 === 1 ? 1 : 0;

    // rhino physics
    if (lift > 0 || vy > 0) {
      lift += vy;
      vy -= duck ? 1.7 : 0.6;
      if (lift <= 0) { lift = 0; vy = 0; }
    }
    animTick += speed * 0.02;

    // obstacles
    distSince += speed;
    if (distSince >= nextGap) spawn();
    obstacles.forEach(function (o) {
      o.x -= speed + (o.kind === 'bird' ? 1.2 : 0);
      if (o.kind === 'bird') o.t += 0.12;
    });
    obstacles = obstacles.filter(function (o) { return o.x + o.w > -10; });

    // ground and sky
    dots.forEach(function (d) {
      d.x -= speed;
      if (d.x < -10) { d.x = W + Math.random() * 30; d.y = GROUND + 8 + Math.random() * 28; }
    });
    moveSky(speed * 0.12);

    // collisions
    var rb = rhinoBox();
    for (var a = 0; a < obstacles.length; a++) {
      var o = obstacles[a];
      if (o.x > RX + 90) continue;
      var boxes = hitboxes(o);
      for (var b = 0; b < boxes.length; b++) {
        if (hit(rb, boxes[b])) { die(); return; }
      }
    }
  }

  /* ---------- drawing ---------- */
  function drawCloud(c) {
    var s = c.s, x = Math.round(c.x), y = Math.round(c.y), r = Math.round;
    ctx.fillStyle = pal.cloud;
    ctx.fillRect(x, y + r(8 * s), r(46 * s), r(8 * s));
    ctx.fillRect(x + r(8 * s), y + r(3 * s), r(26 * s), r(8 * s));
    ctx.fillRect(x + r(24 * s), y, r(14 * s), r(6 * s));
  }

  function drawCactus(o) {
    o.parts.forEach(function (p) {
      var px = Math.round(o.x + p.dx), top = GROUND - p.h, sw = 8, sx = px + Math.floor((p.w - sw) / 2);
      ctx.fillStyle = pal.ink;
      ctx.fillRect(sx, top, sw, p.h);
      var ay = top + Math.floor(p.h * 0.38);
      ctx.fillRect(px, ay, sx - px + 2, 5);
      ctx.fillRect(px, ay - 9, 5, 14);
      var by = top + Math.floor(p.h * 0.55);
      ctx.fillRect(sx + sw - 2, by, px + p.w - (sx + sw) + 2, 5);
      ctx.fillRect(px + p.w - 5, by - 9, 5, 14);
      ctx.fillStyle = pal.belly;
      ctx.fillRect(sx + 2, top + 4, 2, p.h - 8);
    });
  }

  function drawBird(o) {
    var x = Math.round(o.x), y = Math.round(o.y);
    ctx.fillStyle = pal.ink;
    ctx.fillRect(x + 8, y + 9, 24, 8);
    ctx.fillRect(x + 30, y + 7, 9, 9);
    ctx.fillRect(x + 38, y + 10, 6, 3);
    ctx.fillRect(x + 2, y + 11, 8, 3);
    if (Math.floor(o.t) % 2 === 0) {
      ctx.fillRect(x + 14, y + 1, 10, 8);
      ctx.fillRect(x + 10, y + 4, 6, 5);
    } else {
      ctx.fillRect(x + 14, y + 17, 10, 7);
      ctx.fillRect(x + 10, y + 17, 6, 4);
    }
    ctx.fillStyle = pal.belly;
    ctx.fillRect(x + 12, y + 13, 14, 2);
    ctx.fillStyle = pal.bg;
    ctx.fillRect(x + 34, y + 9, 2, 2);
  }

  function drawRhino() {
    var ducking = duck && lift === 0;
    var air = lift > 0;
    var f = Math.floor(animTick) % 2;
    var top = GROUND - Math.round(lift) - (ducking ? 30 : 52);
    function R(dx, dy, w, h, c) { ctx.fillStyle = c; ctx.fillRect(RX + dx, top + dy, w, h); }

    [[8, 0], [18, 1], [34, 0], [44, 1]].forEach(function (L) {
      var down = air ? false : f === L[1];
      var len = ducking ? (down ? 6 : 3) : (air ? 7 : (down ? 12 : 6));
      R(L[0], ducking ? 24 : 40, 8, len, pal.ink);
    });

    if (!ducking) {
      R(0, 16, 6, 5, pal.horn);          // tail
      R(4, 12, 44, 28, pal.body);        // body
      R(12, 30, 28, 6, pal.belly);       // belly
      R(42, 16, 22, 24, pal.body);       // head
      R(58, 8, 6, 8, pal.horn);          // horn
      R(60, 4, 4, 4, pal.horn);          // horn tip
      R(46, 10, 6, 6, pal.horn);         // ear
      R(62, 32, 2, 3, pal.horn);         // nostril
      if (dead) {
        R(51, 21, 2, 2, pal.eye); R(55, 21, 2, 2, pal.eye); R(53, 23, 2, 2, pal.eye);
        R(51, 25, 2, 2, pal.eye); R(55, 25, 2, 2, pal.eye);
      } else { R(52, 22, 5, 5, pal.eye); }
    } else {
      R(0, 10, 6, 5, pal.horn);
      R(4, 6, 44, 18, pal.body);
      R(12, 16, 28, 4, pal.belly);
      R(42, 8, 22, 16, pal.body);
      R(58, 2, 6, 6, pal.horn);
      R(60, 0, 4, 3, pal.horn);
      R(46, 3, 6, 5, pal.horn);
      R(62, 18, 2, 3, pal.horn);
      if (dead) {
        R(51, 11, 2, 2, pal.eye); R(55, 11, 2, 2, pal.eye); R(53, 13, 2, 2, pal.eye);
        R(51, 15, 2, 2, pal.eye); R(55, 15, 2, 2, pal.eye);
      } else { R(52, 12, 5, 4, pal.eye); }
    }
  }

  function render(ts) {
    mixPal(nightT);
    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, W, H);

    // sun / moon
    ctx.fillStyle = pal.belly;
    ctx.fillRect(W - 104, 22, 16, 28); ctx.fillRect(W - 110, 28, 28, 16); ctx.fillRect(W - 107, 25, 22, 22);

    // stars fade in at night
    if (nightT > 0.03) {
      ctx.fillStyle = pal.star;
      stars.forEach(function (s) {
        ctx.globalAlpha = nightT * (0.45 + 0.55 * Math.abs(Math.sin(ts / 700 + s.p)));
        ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, 2);
      });
      ctx.globalAlpha = 1;
    }

    clouds.forEach(drawCloud);

    // ground
    ctx.fillStyle = pal.ink;
    ctx.fillRect(0, GROUND, W, 3);
    ctx.fillStyle = pal.dots;
    dots.forEach(function (d) { ctx.fillRect(Math.round(d.x), Math.round(d.y), d.w, 2); });

    obstacles.forEach(function (o) { if (o.kind === 'bird') drawBird(o); else drawCactus(o); });
    drawRhino();
  }

  /* ---------- loop ---------- */
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(50, ts - last);
    last = ts;
    if (state === 'running') {
      acc += dt;
      while (acc >= STEP) {
        update();
        acc -= STEP;
        if (state !== 'running') { acc = 0; break; }
      }
    } else if (state === 'ready') {
      moveSky(0.3);
    }
    render(ts);
  }
  requestAnimationFrame(frame);

  /* ---------- input ---------- */
  function isJumpKey(c) { return c === 'Space' || c === 'ArrowUp' || c === 'KeyW'; }
  function isDuckKey(c) { return c === 'ArrowDown' || c === 'KeyS'; }

  window.addEventListener('keydown', function (e) {
    var c = e.code;
    var onButton = e.target && e.target.tagName === 'BUTTON';
    if (isJumpKey(c)) {
      if (onButton && c === 'Space') return;
      e.preventDefault();
      if (!e.repeat) press();
    } else if (isDuckKey(c)) {
      e.preventDefault();
      duck = true;
    } else if (c === 'KeyP' || c === 'Escape') {
      togglePause();
    } else if (c === 'KeyM') {
      toggleSound();
    }
  });
  window.addEventListener('keyup', function (e) {
    if (isJumpKey(e.code)) releaseJump();
    else if (isDuckKey(e.code)) duck = false;
  });
  window.addEventListener('pointerup', releaseJump);
  window.addEventListener('pointercancel', releaseJump);

  stage.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });

  btnJump.addEventListener('pointerdown', function (e) { e.preventDefault(); btnJump.classList.add('down'); press(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) {
    btnJump.addEventListener(n, function () { btnJump.classList.remove('down'); });
  });
  btnDuck.addEventListener('pointerdown', function (e) { e.preventDefault(); duck = true; btnDuck.classList.add('down'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) {
    btnDuck.addEventListener(n, function () { duck = false; btnDuck.classList.remove('down'); });
  });

  btnPause.addEventListener('click', function () { togglePause(); btnPause.blur(); });

  function syncSound() {
    btnSound.textContent = muted ? 'Sound off' : 'Sound on';
    btnSound.setAttribute('aria-pressed', String(!muted));
  }
  function toggleSound() {
    muted = !muted;
    writeStore('dino-the-rino-mute', muted ? '1' : '0');
    syncSound();
    if (!muted) beep(660, 880, 0.08, 'square', 0.04);
  }
  btnSound.addEventListener('click', function () { toggleSound(); btnSound.blur(); });
  syncSound();

  document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'running') togglePause(); });
  window.addEventListener('blur', function () { if (state === 'running') togglePause(); });
})();
</script>

</body></html>
